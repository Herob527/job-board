apiVersion: apps/v1
kind: Deployment
metadata: 
  name: postgres 
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata: 
      name: postgres 
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: "postgres:18.6-alpine3.24"
          ports:
            - containerPort: 5432


